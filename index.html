<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Chain</title>
<style>
  :root { --bg:#fff; --fg:#000; box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --fg:#fff; } }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin:0; background:var(--bg); color:var(--fg); }
  body { font: 17px/1.4 -apple-system, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 420px; margin: 0 auto; padding: 32px 20px 48px; }
  h1 { font-size: 15px; font-weight: 400; margin: 0 0 40px; }
  .habit { margin-bottom: 44px; }
  .row { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; }
  .name { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
  .streak { font-size: 15px; }
  .grid { display:grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cell { aspect-ratio:1; border:2px solid var(--fg); background:transparent; padding:0; cursor:pointer; }
  .cell.done { background: var(--fg); }
  .cell.today { outline: 2px solid var(--fg); outline-offset: 3px; }
  .cell:focus-visible, button:focus-visible, input:focus-visible { outline: 3px dashed var(--fg); outline-offset: 3px; }
  .remove { background:none; border:none; color:var(--fg); font:inherit; font-size:13px; text-decoration:underline; cursor:pointer; padding:8px 0 0; opacity:.6; }
  form { display:flex; gap:8px; border-top:2px solid var(--fg); padding-top:20px; }
  input { flex:1; min-width:0; font:inherit; background:transparent; color:var(--fg); border:2px solid var(--fg); border-radius:0; padding:10px; }
  .add { font:inherit; background:var(--fg); color:var(--bg); border:none; padding:0 18px; cursor:pointer; }
  .empty { margin-bottom: 32px; }
</style>
</head>
<body>
<main>
  <h1>Don't break the chain.</h1>
  <div id="list"></div>
  <form id="form">
    <input id="new" placeholder="New habit" aria-label="New habit name" maxlength="30">
    <button class="add" type="submit">Add</button>
  </form>
</main>
<script>
const KEY = 'chain-v1';
const DAYS = 28;
let habits;
try { habits = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
if (!Array.isArray(habits)) habits = [{ name: 'Language', days: {} }, { name: 'Python', days: {} }];

const save = () => { try { localStorage.setItem(KEY, JSON.stringify(habits)); } catch (e) {} };
const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const dayOffset = n => { const d = new Date(); d.setDate(d.getDate() - n); return d; };

function streak(h) {
  let n = h.days[iso(dayOffset(0))] ? 0 : 1, count = 0;
  while (h.days[iso(dayOffset(n))]) { count++; n++; }
  return count;
}

function render() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  if (!habits.length) list.innerHTML = '<p class="empty">Add a habit to start your chain.</p>';
  habits.forEach((h, i) => {
    const el = document.createElement('section');
    el.className = 'habit';
    const s = streak(h);
    el.innerHTML = `<div class="row"><span class="name"></span><span class="streak">${s} day${s === 1 ? '' : 's'}</span></div><div class="grid"></div><button class="remove">Remove</button>`;
    el.querySelector('.name').textContent = h.name;
    const grid = el.querySelector('.grid');
    for (let n = DAYS - 1; n >= 0; n--) {
      const d = dayOffset(n), key = iso(d);
      const b = document.createElement('button');
      b.className = 'cell' + (h.days[key] ? ' done' : '') + (n === 0 ? ' today' : '');
      b.setAttribute('aria-label', `${h.name}, ${d.toDateString()}${h.days[key] ? ', done' : ''}`);
      b.onclick = () => { h.days[key] ? delete h.days[key] : h.days[key] = 1; save(); render(); };
      grid.appendChild(b);
    }
    el.querySelector('.remove').onclick = () => {
      if (confirm(`Remove ${h.name} and its history?`)) { habits.splice(i, 1); save(); render(); }
    };
    list.appendChild(el);
  });
}

document.getElementById('form').onsubmit = e => {
  e.preventDefault();
  const input = document.getElementById('new'), name = input.value.trim();
  if (!name) return;
  habits.push({ name, days: {} }); input.value = ''; save(); render();
};

// Re-render when the app is reopened on a new day
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
